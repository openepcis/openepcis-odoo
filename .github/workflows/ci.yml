name: CI

on:
  push:
    branches: [18.0, 19.0]
  pull_request:

# Nothing in the repositories this addon came from publishes a Python artifact,
# so there was no pipeline to copy. This one does the two things that matter:
# it lints, and it installs the addon into a real Odoo and runs its tests.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          # Must match required-version in pyproject.toml. The action cannot
          # read [tool.ruff].required-version (its version-file input expects a
          # dependency pin), and "latest" broke the moment 0.16.4 came out. The
          # duplication is guarded: ruff itself refuses to run when the two
          # values diverge, so they cannot drift apart silently.
          version: "0.16.2"
          args: check --output-format=github

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.2"  # guarded against pyproject.toml by ruff itself
          args: format --check --diff

  release-idioms:
    # One branch per Odoo release, and the differences between them are few
    # enough to check mechanically. This is not a nicety: on Odoo 19 the old
    # _sql_constraints form is accepted, warned about once and then ignored, so
    # a constraint that was meant to exist simply does not. Nothing fails, no
    # test can miss it, and the damage — two parties on one GLN, one movement
    # reported twice — surfaces in production. Seconds, and no database.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check-release-idioms.py

  gs1-helpers:
    # The GS1 arithmetic is pure Python. Running it without a database means a
    # broken check digit is reported in seconds rather than after a full install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check digits, key validation, language tags
        run: |
          mkdir -p _probe
          cp -r openepcis_connector/utils _probe/utils
          # utils/gs1.py re-exports from the vendored library, so the probe
          # needs the gs1 slice of the vendor tree at the same relative
          # position — only the slice, because unittest discovery imports
          # every package it walks and the transport modules need requests.
          mkdir -p _probe/vendor/benelog_client/core
          cp openepcis_connector/vendor/__init__.py _probe/vendor/
          cp openepcis_connector/vendor/benelog_client/__init__.py _probe/vendor/benelog_client/
          cp openepcis_connector/vendor/benelog_client/core/__init__.py \
             openepcis_connector/vendor/benelog_client/core/gs1.py \
             openepcis_connector/vendor/benelog_client/core/errors.py \
             _probe/vendor/benelog_client/core/
          mkdir -p _probe/tests
          cp openepcis_connector/tests/test_gs1.py _probe/tests/
          touch _probe/__init__.py _probe/tests/__init__.py
          python -m unittest discover -s _probe -t . -p 'test_*.py' -v

  tests:
    runs-on: ubuntu-latest
    container:
      image: odoo:18
      options: --user root
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: addons/openepcis-odoo

      - name: Install and run the test suite
        run: sh addons/openepcis-odoo/tools/ci-run-tests.sh \
               "${GITHUB_WORKSPACE}/addons/openepcis-odoo"

  # Which branch is the counterpart? Asked of the manifests, not written into
  # this file — a workflow that names the other release would itself become a
  # difference between the branches, and fewer of those is the whole point.
  port-target:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.pick.outputs.branch }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: pick
        run: python3 tools/check-release-idioms.py --other >> "$GITHUB_OUTPUT"

  port-check:
    # Does this change still work on the other branch?
    #
    # One branch per Odoo release means every change has to land on both, and
    # the last time that was left to a later port it accumulated 63 commits and
    # four API breaks. This carries the change onto the counterpart while the
    # author still has the context, and runs the suite there. A red port check
    # does not mean the change is wrong — it means the other branch needs its
    # own version of it, which is far cheaper to write now than in three months.
    #
    # Advisory until 2026-09-15: drop continue-on-error after that, once the
    # branches have stayed in step through a few ordinary changes.
    continue-on-error: true
    needs: port-target
    runs-on: ubuntu-latest
    container:
      image: odoo:${{ needs.port-target.outputs.release }}
      options: --user root
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      # The odoo image ships no git, and checkout would silently fall back to a
      # tarball with no history — which cannot be merged onto anything.
      - name: git, for the merge
        run: |
          apt-get update -qq
          apt-get install -y -qq git

      - uses: actions/checkout@v5
        with:
          path: addons/openepcis-odoo
          fetch-depth: 0

      - name: Carry this change onto ${{ needs.port-target.outputs.branch }}
        working-directory: addons/openepcis-odoo
        env:
          OTHER: ${{ needs.port-target.outputs.branch }}
        run: |
          git config user.email ci@openepcis.invalid
          git config user.name "CI"
          git fetch --quiet origin "$OTHER"
          git checkout --quiet -b port-check "origin/$OTHER"
          git merge --no-edit ${{ github.event.pull_request.head.sha }} || {
            echo "::error::This change does not carry onto $OTHER without conflicts."
            git --no-pager diff --diff-filter=U --name-only
            exit 1
          }

      # The counterpart has to agree with itself too. This is where a constraint
      # written in 18's idiom and merged onto 19 is caught — the form 19 accepts,
      # warns about once, and then ignores.
      - name: The other branch's idioms
        working-directory: addons/openepcis-odoo
        run: python3 tools/check-release-idioms.py

      - name: Install and run the test suite there
        run: sh addons/openepcis-odoo/tools/ci-run-tests.sh \
               "${GITHUB_WORKSPACE}/addons/openepcis-odoo"
