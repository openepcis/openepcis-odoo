name: CI

on:
  push:
    branches: [18.0, 19.0]
  pull_request:

# Nothing in the repositories this addon came from publishes a Python artifact,
# so there was no pipeline to copy. This one does the two things that matter:
# it lints, and it installs the addon into a real Odoo and runs its tests.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          # Must match required-version in pyproject.toml. The action cannot
          # read [tool.ruff].required-version (its version-file input expects a
          # dependency pin), and "latest" broke the moment 0.16.4 came out. The
          # duplication is guarded: ruff itself refuses to run when the two
          # values diverge, so they cannot drift apart silently.
          version: "0.16.2"
          args: check --output-format=github

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.2"  # guarded against pyproject.toml by ruff itself
          args: format --check --diff

  gs1-helpers:
    # The GS1 arithmetic is pure Python. Running it without a database means a
    # broken check digit is reported in seconds rather than after a full install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check digits, key validation, language tags
        run: |
          mkdir -p _probe
          cp -r openepcis_connector/utils _probe/utils
          # utils/gs1.py re-exports from the vendored library, so the probe
          # needs the gs1 slice of the vendor tree at the same relative
          # position — only the slice, because unittest discovery imports
          # every package it walks and the transport modules need requests.
          mkdir -p _probe/vendor/benelog_client/core
          cp openepcis_connector/vendor/__init__.py _probe/vendor/
          cp openepcis_connector/vendor/benelog_client/__init__.py _probe/vendor/benelog_client/
          cp openepcis_connector/vendor/benelog_client/core/__init__.py \
             openepcis_connector/vendor/benelog_client/core/gs1.py \
             openepcis_connector/vendor/benelog_client/core/errors.py \
             _probe/vendor/benelog_client/core/
          mkdir -p _probe/tests
          cp openepcis_connector/tests/test_gs1.py _probe/tests/
          touch _probe/__init__.py _probe/tests/__init__.py
          python -m unittest discover -s _probe -t . -p 'test_*.py' -v

  tests:
    runs-on: ubuntu-latest
    container:
      image: odoo:18
      options: --user root
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: addons/openepcis-odoo

      # The events addon declares epcis-event-hash-generator as an external
      # dependency (it recognises our own events coming back by their canonical
      # hash). Without it Odoo lists the addon as uninstallable and every test
      # in it is silently skipped rather than failed — the worst of both.
      - name: Install the canonical hash generator
        run: pip3 install --no-cache-dir --break-system-packages "epcis-event-hash-generator==1.9.3"

      - name: Install and run the test suite
        run: |
          odoo -d ci \
            -i openepcis_connector,openepcis_connector_stock,openepcis_connector_product_expiry,openepcis_connector_events \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,${GITHUB_WORKSPACE}/addons/openepcis-odoo \
            --db_host=db --db_user=odoo --db_password=odoo \
            --data-dir=/tmp/odoo-data \
            --test-enable --test-tags /openepcis_connector,/openepcis_connector_stock,/openepcis_connector_product_expiry,/openepcis_connector_events \
            --stop-after-init --log-level=test 2>&1 | tee odoo.log

      - name: Fail on any failed test
        run: |
          # Odoo exits 0 even when tests fail, so the log is the source of truth.
          if grep -qE "[0-9]+ failed, [0-9]+ error\(s\)" odoo.log \
             && ! grep -q "0 failed, 0 error(s)" odoo.log; then
            echo "::error::Odoo reported failing tests"
            grep -E "(FAIL|ERROR):" odoo.log || true
            exit 1
          fi
          grep -q "0 failed, 0 error(s)" odoo.log || {
            echo "::error::No test summary in the log — the run did not complete"
            tail -50 odoo.log
            exit 1
          }
